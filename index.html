<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0f2f3d" />
  <title>Энергоград — Умный дом</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      z-index: 1;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
      color: #153949;
      background: #f7fbfc;
      font-size: 23px;
      line-height: 1.35;
      font-weight: 800;
    }

    #scanUI {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    .title-pill {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      border-radius: 999px;
      color: #17384a;
      background: rgba(255,255,255,.94);
      box-shadow: 0 8px 25px rgba(0,0,0,.18);
      font-size: clamp(18px, 5vw, 23px);
      font-weight: 800;
      white-space: nowrap;
    }

    .scan-hint {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: max(28px, env(safe-area-inset-bottom));
      padding: 14px 18px;
      border-radius: 22px;
      color: #fff;
      background: rgba(20,71,91,.88);
      box-shadow: 0 8px 25px rgba(0,0,0,.18);
      text-align: center;
      font-size: clamp(17px, 4.6vw, 21px);
      line-height: 1.25;
      font-weight: 750;
    }

    #gameOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      overflow-y: auto;
      padding: 18px 16px 18px;
      background: rgba(5,23,32,.62);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .game-shell {
      width: min(100%, 520px);
      min-height: 0;
      height: auto;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 12px;
      padding-top: 0;
      transform: none;
    }

    .game-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 12;
    }

    .room-name {
      flex: 1;
      padding: 11px 16px;
      border-radius: 18px;
      color: #17384a;
      background: rgba(255,255,255,.96);
      box-shadow: 0 7px 22px rgba(0,0,0,.16);
      font-size: clamp(18px, 5vw, 23px);
      font-weight: 850;
      text-align: center;
    }

    .close-game {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border: 0;
      border-radius: 50%;
      color: #17384a;
      background: rgba(255,255,255,.96);
      box-shadow: 0 7px 22px rgba(0,0,0,.16);
      font-size: 25px;
      font-weight: 900;
      cursor: pointer;
    }

    .media-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 4px solid rgba(255,255,255,.92);
      border-radius: 28px;
      background: #dfecef;
      box-shadow: 0 16px 40px rgba(0,0,0,.28);
    }

    .room-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      background: #dfecef;
    }

    .found-badge {
      position: absolute;
      left: 14px;
      top: 14px;
      z-index: 3;
      padding: 8px 12px;
      border-radius: 999px;
      color: #fff;
      background: rgba(12,75,96,.91);
      box-shadow: 0 5px 15px rgba(0,0,0,.18);
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 800;
    }

    .task-card,
    .success-card {
      padding: 17px 18px;
      border-radius: 24px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 10px 28px rgba(0,0,0,.20);
      text-align: center;
    }

    .task-card {
      color: #102b3a;
      font-size: clamp(21px, 5.7vw, 29px);
      line-height: 1.12;
      font-weight: 850;
    }

    #actionButton {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 24px;
      padding: 15px 20px;
      color: #fff;
      background: linear-gradient(90deg, #ff6b37, #ff008f);
      box-shadow: 0 10px 25px rgba(0,0,0,.22);
      font-size: clamp(22px, 6vw, 29px);
      font-weight: 900;
      cursor: pointer;
    }

    .success-card {
      display: none;
      color: #14683f;
      font-size: clamp(21px, 5.6vw, 28px);
      line-height: 1.18;
      font-weight: 900;
    }

    #scanAgain {
      display: none;
      width: 100%;
      min-height: 52px;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 20px;
      padding: 12px 18px;
      color: #fff;
      background: rgba(16,62,79,.78);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    #status {
      position: fixed;
      z-index: 25;
      left: 12px;
      top: max(72px, calc(env(safe-area-inset-top) + 65px));
      padding: 6px 9px;
      border-radius: 10px;
      color: rgba(255,255,255,.88);
      background: rgba(0,0,0,.28);
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-height: 700px) {
      .game-shell { justify-content: flex-start; }
      .media-card { width: min(82vw, 370px); align-self: center; }
      .task-card { font-size: 20px; padding: 13px 15px; }
      #actionButton { min-height: 50px; font-size: 22px; }
    }
  </style>
</head>

<body>
  <div id="loader">Запускаем камеру…<br>Разрешите доступ к камере.</div>

  <div id="scanUI">
    <div class="title-pill">Энергоград · Умный дом</div>
    <div class="scan-hint" id="scanHint">Наведите камеру на комнату дома</div>
  </div>

  <div id="status">запускаем камеру…</div>

  <div id="gameOverlay">
    <div class="game-shell">
      <div class="game-head">
        <div class="room-name">Комната</div>
        <button class="close-game" id="closeGame" aria-label="Закрыть">×</button>
      </div>

      <div class="media-card">
        <div class="found-badge" id="foundBadge">⚠ Нарушение найдено!</div>

        <video id="bathroomVideo" class="room-media"
          src="./assets/water.mp4"
          preload="auto" loop muted playsinline webkit-playsinline></video>

        <video id="kitchenVideo" class="room-media"
          src="./assets/fridge.mp4"
          preload="auto" loop muted playsinline webkit-playsinline></video>

        <video id="livingroomVideo" class="room-media"
          src="./assets/tvlight.mp4"
          preload="auto" loop muted playsinline webkit-playsinline></video>

        <video id="bedroomVideo" class="room-media"
          src="./assets/window.mp4"
          preload="auto" loop muted playsinline webkit-playsinline></video>

        <img id="bathroomStill" class="room-media"
          src="./assets/bathroom.png" alt="Ванная комната" />

        <img id="kitchenStill" class="room-media"
          src="./assets/kitchen.png" alt="Кухня" />

        <img id="livingroomStill" class="room-media"
          src="./assets/livingroom.png" alt="Гостиная" />

        <img id="bedroomStill" class="room-media"
          src="./assets/bedroom.png" alt="Спальня" />
      </div>

      <div class="task-card" id="taskCard">
        Нарушение найдено.<br>Что нужно сделать?
      </div>

      <button id="actionButton">Исправить</button>

      <div class="success-card" id="successCard">
        ✓ Отлично! Нарушение устранено! ⚡
      </div>

      <button id="scanAgain">Вернуться к поиску</button>
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    xr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="bathroomTarget" mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity id="kitchenTarget" mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity id="livingroomTarget" mindar-image-target="targetIndex: 2"></a-entity>
    <a-entity id="bedroomTarget" mindar-image-target="targetIndex: 3"></a-entity>
  </a-scene>

  <script>
    const loader = document.getElementById('loader');
    const scanUI = document.getElementById('scanUI');
    const scanHint = document.getElementById('scanHint');
    const status = document.getElementById('status');
    const gameOverlay = document.getElementById('gameOverlay');
    const scene = document.querySelector('a-scene');

    const targets = {
      bathroom: document.getElementById('bathroomTarget'),
      kitchen: document.getElementById('kitchenTarget'),
      livingroom: document.getElementById('livingroomTarget'),
      bedroom: document.getElementById('bedroomTarget')
    };

    const videos = {
      bathroom: document.getElementById('bathroomVideo'),
      kitchen: document.getElementById('kitchenVideo'),
      livingroom: document.getElementById('livingroomVideo'),
      bedroom: document.getElementById('bedroomVideo')
    };

    const stills = {
      bathroom: document.getElementById('bathroomStill'),
      kitchen: document.getElementById('kitchenStill'),
      livingroom: document.getElementById('livingroomStill'),
      bedroom: document.getElementById('bedroomStill')
    };

    const taskCard = document.getElementById('taskCard');
    const actionButton = document.getElementById('actionButton');
    const successCard = document.getElementById('successCard');
    const scanAgain = document.getElementById('scanAgain');
    const closeGame = document.getElementById('closeGame');
    const foundBadge = document.getElementById('foundBadge');
    const roomName = document.querySelector('.room-name');

    const rooms = {
      bathroom: {
        name: '🚿 Ванная комната',
        question: 'Ой! Вода убегает.<br>Что нужно сделать?',
        button: 'Закрыть кран',
        solvedBadge: '✓ Кран закрыт',
        success: '✓ Отлично! Вода спасена! 💧⚡',
        statusFound: 'ванная распознана'
      },
      kitchen: {
        name: '🧊 Кухня',
        question: 'Ой! Холод убегает.<br>Что нужно сделать?',
        button: 'Закрыть холодильник',
        solvedBadge: '✓ Холодильник закрыт',
        success: '✓ Отлично! Холод сохранён! ❄️⚡',
        statusFound: 'кухня распознана'
      },
      livingroom: {
        name: '📺 Гостиная',
        question: 'Ой! В пустой комнате работают телевизор и свет.<br>Что нужно сделать?',
        button: 'Выключить всё',
        solvedBadge: '✓ Всё выключено',
        success: '✓ Отлично! Электроэнергия сбережена! 💡⚡',
        statusFound: 'гостиная распознана'
      },
      bedroom: {
        name: '🛏️ Спальня',
        question: 'Ой! Тепло уходит через открытое окно.<br>Что нужно сделать?',
        button: 'Закрыть окно',
        solvedBadge: '✓ Окно закрыто',
        success: '✓ Отлично! Тепло осталось в доме! 🏠⚡',
        statusFound: 'спальня распознана'
      }
    };

    const visibleTargets = {
      bathroom: false,
      kitchen: false,
      livingroom: false,
      bedroom: false
    };

    let gameOpen = false;
    let solved = false;
    let currentRoom = null;
    let blockedRoom = null;

    const roomKeys = Object.keys(rooms);

    const hideAllMedia = () => {
      roomKeys.forEach(key => {
        videos[key].pause();
        videos[key].style.display = 'none';
        stills[key].style.display = 'none';
      });
    };

    const hideLoader = () => {
      loader.style.display = 'none';
      status.textContent = 'камера готова — ищем комнату';
    };

    const prepareRoom = (key) => {
      const room = rooms[key];
      currentRoom = key;

      roomName.textContent = room.name;
      taskCard.innerHTML = room.question;
      actionButton.textContent = room.button;
      successCard.textContent = room.success;
      foundBadge.textContent = '⚠ Нарушение найдено!';

      hideAllMedia();

      videos[key].currentTime = 0;
      videos[key].style.display = 'block';

      taskCard.style.display = 'block';
      actionButton.style.display = 'block';
      successCard.style.display = 'none';
      scanAgain.style.display = 'none';
    };

    const openGame = async (key) => {
      if (gameOpen) return;
      if (blockedRoom === key) return;

      prepareRoom(key);

      gameOpen = true;
      solved = false;

      scanUI.style.display = 'none';
      gameOverlay.style.display = 'block';
      gameOverlay.scrollTop = 0;
      status.textContent = rooms[key].statusFound;

      try {
        await videos[key].play();
      } catch (e) {
        foundBadge.textContent = '⚠ Нарушение найдено! Коснитесь картинки';
      }
    };

    const resetGame = () => {
      const previousRoom = currentRoom;

      solved = false;
      gameOpen = false;
      currentRoom = null;

      hideAllMedia();

      taskCard.style.display = 'block';
      actionButton.style.display = 'block';
      successCard.style.display = 'none';
      scanAgain.style.display = 'none';
      foundBadge.textContent = '⚠ Нарушение найдено!';

      gameOverlay.scrollTop = 0;
      gameOverlay.style.display = 'none';
      scanUI.style.display = 'block';
      scanHint.textContent = 'Наведите камеру на другую комнату дома';
      status.textContent = 'камера готова — ищем другую комнату';

      blockedRoom = previousRoom;

      // Если при выходе уже видна какая-то другая мишень, открываем её.
      const alreadyVisibleOther = roomKeys.find(
        key => key !== previousRoom && visibleTargets[key]
      );

      if (alreadyVisibleOther) {
        setTimeout(() => openGame(alreadyVisibleOther), 150);
      }
    };

    const solveCurrentRoom = () => {
      if (!currentRoom) return;

      solved = true;

      videos[currentRoom].pause();
      videos[currentRoom].style.display = 'none';
      stills[currentRoom].style.display = 'block';

      taskCard.style.display = 'none';
      actionButton.style.display = 'none';
      successCard.style.display = 'block';
      scanAgain.style.display = 'block';

      foundBadge.textContent = rooms[currentRoom].solvedBadge;
      status.textContent = 'задание выполнено';
    };

    scene.addEventListener('arReady', hideLoader);
    setTimeout(hideLoader, 4500);

    roomKeys.forEach(key => {
      targets[key].addEventListener('targetFound', () => {
        visibleTargets[key] = true;

        if (!gameOpen && blockedRoom !== key) {
          openGame(key);
        }
      });

      targets[key].addEventListener('targetLost', () => {
        visibleTargets[key] = false;

        if (blockedRoom === key) {
          blockedRoom = null;
        }

        if (!gameOpen) {
          status.textContent = 'ищем комнату';
        }
      });

      videos[key].addEventListener('click', async () => {
        if (!solved) {
          try {
            await videos[key].play();
          } catch (e) {}
        }
      });
    });

    actionButton.addEventListener('click', solveCurrentRoom);
    scanAgain.addEventListener('click', resetGame);
    closeGame.addEventListener('click', resetGame);
  </script>
</body>
</html>
